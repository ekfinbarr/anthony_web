<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    SEO head (title, description, canonical, robots, Open Graph, Twitter, verification,
    site-wide JSON-LD) is generated at build time from src/config/siteConfig.ts and
    src/config/routes.seo.ts by seo/vite-plugin-seo.ts. Do not hard-code it here.
  -->
  <!--app-seo-head-->

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="msapplication-TileColor" content="#1e3a8a" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Fonts used by news/article content (Post.css). Loaded without blocking first render. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&display=swap" />
  </noscript>
</head>

<body>
  <noscript>
    <p style="padding:1rem;font-family:sans-serif">
      St. Anthony Catholic Church, Gbaja, Surulere, Lagos. Please enable JavaScript to use this website.
    </p>
  </noscript>
  <div id="root"></div>
  <!-- Portal: modals -->
  <div id="modal-root"></div>
  <!-- Portal: video -->
  <div id="video-root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
